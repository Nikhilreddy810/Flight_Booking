
services:

  auth-db:
    image: postgres:16-alpine
    container_name: flight-auth-db
    environment:
      POSTGRES_DB: Flight_Auth_DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./flight-auth-service
    container_name: flight-auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/Flight_Auth_DB
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - auth-db

  flight-db:
    image: postgres:16-alpine
    container_name: flight-flight-db
    environment:
      POSTGRES_DB: Flight_Flight_DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data

  booking-db:
    image: postgres:16-alpine
    container_name: flight-booking-db
    environment:
      POSTGRES_DB: Flight_Booking_DB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  flight-service:
    build:
      context: ./flight-flight-service
    container_name: flight-flight-service
    environment:
      DB_URL: jdbc:postgresql://flight-db:5432/Flight_Flight_DB
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      - flight-db
      - redis

  booking-service:
    build:
      context: ./flight-booking-service
    container_name: flight-booking-service
    environment:
      DB_URL: jdbc:postgresql://booking-db:5432/Flight_Booking_DB
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FLIGHT_SERVICE_URL: http://flight-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8083:8083"
    depends_on:
      - booking-db
      - flight-service
      - kafka

  notification-service:
    build:
      context: ./flight-notification-service
    container_name: flight-notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8084:8084"
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:4.2.0
    container_name: flight-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9094,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  nginx:
    image: nginx:alpine
    container_name: flight-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - flight-service
      - booking-service

volumes:
  auth-db-data:
  flight-db-data:
  booking-db-data:
  redis-data:
