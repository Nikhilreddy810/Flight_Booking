# Test configuration: in-memory H2 so `mvn test` needs no MySQL or Redis,
# and no real secrets are required to build the project.
spring.datasource.url=jdbc:h2:mem:flight_booking_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# The migrations are MySQL-specific, so tests build the schema straight from the
# entities on H2 instead of replaying them.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=test-only-secret-key-not-used-outside-of-unit-tests

spring.cache.type=none

# AdminSeeder stays inert while testing.
app.admin.username=
app.admin.password=
