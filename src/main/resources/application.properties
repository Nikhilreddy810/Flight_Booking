# MySQL connection
# In Docker these are overridden by SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/flight_booking
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (JPA)
# validate, not update: Flyway owns the schema. Hibernate only checks that the
# entities match what the migrations produced and fails fast if they drifted.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway — migrations live in src/main/resources/db/migration
spring.flyway.enabled=true
# Databases created before Flyway existed are stamped at V1 instead of running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server port
server.port=8080

# JWT secret — must be at least 32 characters (256 bits) for HS256.
# No default on purpose: the app should fail to start rather than sign tokens
# with a key that is public in the repository.
jwt.secret=${JWT_SECRET}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Optional bootstrap admin account. /auth/register only ever creates ROLE_USER,
# so this is how the first ROLE_ADMIN gets created.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
